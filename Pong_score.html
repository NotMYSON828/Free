<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pong</title>
<style>
html,body{margin:0;height:100%;background:#111;display:flex;justify-content:center;align-items:center}
canvas{background:#000;width:min(800px,100vw);height:min(600px,75vw);max-height:100vh;cursor:none}
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");

let pongballx=400,pongbally=300,paddle=0;
let speedy=7,speedx=5;
let hits=0,highScore=0,gameOver=true;

function draw(){
  ctx.fillStyle="black";ctx.fillRect(0,0,800,600);
  ctx.fillStyle="white";

  // Scores
  ctx.font="bold 28px 'Courier New'";
  ctx.textAlign="left";ctx.fillText("HITS: "+hits,25,35);
  ctx.textAlign="right";ctx.fillText("HIGH SCORE: "+highScore,775,35);
  ctx.textAlign="left";

  if(gameOver){
    ctx.fillRect(750,paddle,15,150);
    ctx.fillRect(399,0,2,600);
    ctx.beginPath();ctx.arc(pongballx+20,pongbally+20,20,0,Math.PI*2);ctx.fill();
    ctx.font="bold 90px 'Courier New'";ctx.fillText("PONG",290,110);
  }else{
    ctx.fillRect(399,0,2,600);
    ctx.beginPath();ctx.arc(pongballx+20,pongbally+20,20,0,Math.PI*2);ctx.fill();
    ctx.font="bold 90px 'Courier New'";ctx.fillText("Game over!!",100,200);
    ctx.font="bold 28px 'Courier New'";ctx.fillText("Tap to restart",275,260);
  }
}

function update(){
  if(!gameOver)return;
  pongballx+=speedx;pongbally+=speedy;

  if(pongbally>=510){pongbally=510;speedy=-Math.abs(speedy);}
  if(pongbally<=0){pongbally=0;speedy=Math.abs(speedy);}
  if(pongballx<=0){pongballx=0;speedx=Math.abs(speedx);}

  // Paddle hit: count it, then speed up a little
  if(pongballx>=720 && pongballx<=750 &&
     pongbally+40>=paddle && pongbally<=paddle+150 && speedx>0){
    pongballx=719;
    hits++;
    if(hits>highScore)highScore=hits;

    speedx=Math.min(12,speedx+0.5);
    speedy=Math.sign(speedy)*Math.min(12,Math.abs(speedy)+0.25);
    speedx=-speedx;
  }

  if(pongballx>750){
    speedx=0;speedy=0;gameOver=false;
  }
}

function restart(){
  pongballx=400;pongbally=300;
  speedx=5;speedy=7;
  hits=0; // highScore intentionally stays
  gameOver=true;
}

function movePaddle(clientY){
  const r=canvas.getBoundingClientRect();
  paddle=(clientY-r.top)*(600/r.height)-75;
  paddle=Math.max(0,Math.min(450,paddle));
}
canvas.addEventListener("mousemove",e=>movePaddle(e.clientY));
canvas.addEventListener("touchmove",e=>{e.preventDefault();movePaddle(e.touches[0].clientY)},{passive:false});
canvas.addEventListener("click",()=>{if(!gameOver)restart()});
canvas.addEventListener("touchstart",()=>{if(!gameOver)restart()});

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
